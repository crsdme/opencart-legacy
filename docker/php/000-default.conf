<VirtualHost *:80>
    Timeout 3600
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    Alias /docs-media /var/www/docs

    <Directory /var/www/docs>
        Options -Indexes
        AllowOverride None
        Require all denied
        <FilesMatch "\.(png|jpe?g|gif|webp|svg|avif)$">
            Require all granted
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
